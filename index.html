<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frontend</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <!-- Prevent flash of wrong theme (FOUT) — runs before render -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f0f2f8;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: spin 3s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Dark mode loading screen — triggered by .dark class set by our inline script */
    :root.dark .loading-container {
      background-color: #0d0d1c;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="loading-container">
      <div class="logo-wrapper">
        <img src="/src/assets/images/logo.png" alt="M-Pay Logo" class="logo" />
        <img src="/src/assets/images/loading.png" alt="Loading" class="spinner" />
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
